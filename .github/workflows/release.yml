name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release artifacts without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MIX_ENV: prod
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27.2"

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          tag="${GITHUB_REF_NAME#v}"
          base_tag="${tag%%-*}"
          if [ "${tag}" != "${version}" ] && [ "${base_tag}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match mix.exs version ${version}"
            exit 1
          fi

      - name: Build release artifacts
        run: |
          mix local.hex --force --if-missing
          mix compile --warnings-as-errors
          mix escript.build
          ./vulncheck --version
          sha256sum vulncheck > vulncheck.sha256
          cat vulncheck.sha256

      - name: Verify Hex package build
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix docs --warnings-as-errors
          mix hex.build

      - name: Upload candidate artifacts (dry-run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vulncheck-release-candidate
          path: |
            vulncheck
            vulncheck.sha256

      - name: Extract release notes from CHANGELOG.md
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [${version}]" '
            index($0, hdr) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::no CHANGELOG.md section found for ${version}"
            exit 1
          fi
          prev_tag="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -Fxv "${GITHUB_REF_NAME}" | head -n 1)"
          if [ -n "${prev_tag}" ]; then
            printf '\n---\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${GITHUB_REPOSITORY}" "${prev_tag}" "${GITHUB_REF_NAME}" >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            vulncheck
            vulncheck.sha256
          fail_on_unmatched_files: true

      - name: Publish to Hex.pm
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/') && env.HEX_API_KEY != ''
        env:
          MIX_ENV: dev
        run: mix hex.publish --yes
