name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27.2"

jobs:
  lint-and-typecheck:
    name: Lint, docs and Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: lint-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix docs --warnings-as-errors

      - name: Restore Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: _build/plts
          key: plts-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plts-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mkdir -p _build/plts && mix dialyzer --plt
      - run: mix dialyzer --format github

  test-matrix:
    name: Test (OTP ${{ matrix.otp }}, Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "26.2"
            elixir: "1.18"
            experimental: false
          - otp: "27.2"
            elixir: "1.18"
            experimental: false
            coverage: true
          - otp: "28"
            elixir: "1.19"
            experimental: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: mix test --trace --include escript

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: mix test --trace --include escript --cover

      - name: Build and smoke-test the escript
        env:
          MIX_ENV: prod
        run: |
          mix escript.build
          ./vulncheck --version
          ./vulncheck --help > /dev/null
          mix run --no-deps-check -e '
            osv = JSON.encode!(%{
              "id" => "GHSA-smoke-plug-0001",
              "affected" => [%{
                "package" => %{"ecosystem" => "Hex", "name" => "plug"},
                "ranges" => [%{"type" => "SEMVER", "events" => [%{"introduced" => "1.0.0"}, %{"fixed" => "1.16.0"}]}]
              }]
            })
            {:ok, {_name, zip}} = :zip.create(~c"osv_all.zip", [{~c"GHSA-smoke-plug-0001.json", osv}], [:memory])
            cache_dir = Path.join(System.tmp_dir!(), "vulncheck_ci_smoke_cache")
            File.rm_rf!(cache_dir)
            cfg = %VulnCheck.Config{cache_dir: cache_dir, offline: false}
            rel = VulnCheck.Feeds.OSV.cache_file()
            :ok = VulnCheck.Cache.publish_entry(
              Path.join(VulnCheck.Cache.feeds_dir(cfg), rel),
              zip,
              %{"sha256" => VulnCheck.Cache.sha256(zip), "fetched_at_unix" => System.os_time(:second)}
            )
            {:ok, _} = VulnCheck.Cache.Bundle.export_bundle(cfg, "/tmp/vulncheck-smoke-bundle.tar.gz")
          '
          ./vulncheck --project-dir benchmarks/real_world/umbrella_three_apps --offline --bundle /tmp/vulncheck-smoke-bundle.tar.gz --format json --fail-on none > /tmp/vulncheck-smoke.json
          elixir -e '
            data = File.read!("/tmp/vulncheck-smoke.json") |> JSON.decode!()
            findings = Map.fetch!(data, "findings")
            true = Enum.any?(findings, &(&1["package"] == "plug" and &1["advisory_id"] == "GHSA-smoke-plug-0001"))
          '

  dogfood-security-audit:
    name: Scan VulnCheck with VulnCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore advisory feeds
        uses: actions/cache@v4
        with:
          path: ~/.cache/vulncheck/feeds
          key: vulncheck-feeds-${{ github.run_id }}
          restore-keys: |
            vulncheck-feeds-

      - run: mix deps.get

      - name: Compile the production build
        env:
          MIX_ENV: prod
        run: mix compile --warnings-as-errors

      - name: Audit dependencies
        run: mix vulncheck --fail-on potentially_reachable --format github

      - name: Audit through the GitHub Action
        uses: ./
        with:
          fail-on: potentially_reachable
          compile: "false"
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
